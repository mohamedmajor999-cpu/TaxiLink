<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>V4 · Poster une annonce</title>
  <style>
    :root {
      --ink: #0a0a0a; --ink-soft: #6b6b6b; --ink-muted: #9a9a9a;
      --bg: #ffffff; --line: #ececec;
      --brand: #ffd23f; --accent: #1a1a1a; --success: #16a34a;
    }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #1c1c1c; color: var(--ink);
    }
    .phone {
      width: 390px; height: 844px; margin: 40px auto;
      background: var(--bg); border-radius: 44px;
      overflow: hidden; position: relative;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 8px #2a2a2a, 0 0 0 9px #555;
    }
    .statusbar {
      position: absolute; top: 0; left: 0; right: 0; height: 50px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 32px;
      font-size: 14px; font-weight: 700; color: var(--ink); z-index: 30;
    }
    .statusbar .right { display: flex; gap: 6px; align-items: center; font-size: 13px; }

    /* Header full screen modal */
    .modal-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px 4px;
      margin-top: 40px;
    }
    .close-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: #f3f3f3;
      display: flex; align-items: center; justify-content: center;
    }
    .step-pill {
      font-size: 11px; font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--ink-soft);
    }
    .step-pill b { color: var(--ink); }

    /* Title */
    .titlewrap { padding: 18px 24px 8px; }
    .titlewrap h1 {
      margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.8px;
      line-height: 1.15;
    }
    .titlewrap p {
      margin: 6px 0 0; font-size: 14px; color: var(--ink-soft);
      line-height: 1.45;
    }

    /* Voice button — central */
    .voice-section {
      padding: 20px 24px 12px;
      display: flex; flex-direction: column; align-items: center;
    }
    .voice-btn {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: var(--brand);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      box-shadow:
        0 0 0 12px rgba(255,210,63,0.12),
        0 0 0 24px rgba(255,210,63,0.06),
        0 16px 40px rgba(255,210,63,0.4);
    }
    .voice-btn svg { width: 56px; height: 56px; }
    .voice-hint {
      margin-top: 18px; font-size: 14px; font-weight: 700;
      color: var(--ink);
      text-align: center;
    }
    .voice-sub {
      margin-top: 4px; font-size: 12.5px; color: var(--ink-soft);
      text-align: center;
    }

    /* Divider OR */
    .or-divider {
      display: flex; align-items: center; gap: 12px;
      padding: 20px 24px 12px;
    }
    .or-divider .line { flex: 1; height: 1px; background: var(--line); }
    .or-divider .or { font-size: 11px; font-weight: 800; color: var(--ink-muted); letter-spacing: 0.6px; }

    /* Form rows */
    .form { padding: 0 24px; }
    .field {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .field:last-child { border-bottom: 0; }
    .field-icon {
      width: 36px; height: 36px; border-radius: 12px;
      background: #f5f5f5;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .field-icon svg { width: 18px; height: 18px; }
    .field-body { flex: 1; min-width: 0; }
    .field-label { font-size: 11.5px; font-weight: 700; color: var(--ink-muted); letter-spacing: 0.3px; }
    .field-value {
      font-size: 15px; font-weight: 700; color: var(--ink-soft);
      margin-top: 2px;
    }
    .field-value.filled { color: var(--ink); }
    .field-chev {
      color: var(--ink-muted);
    }

    /* CTA bottom */
    .cta-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 14px 20px 32px;
      background: #fff;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.04);
      border-top: 1px solid var(--line);
    }
    .cta {
      width: 100%; height: 56px;
      background: var(--accent); color: #fff;
      border: 0; border-radius: 16px;
      font-size: 16px; font-weight: 800;
      letter-spacing: -0.2px;
      opacity: 0.45;
    }

    .home-indicator {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 134px; height: 5px; border-radius: 3px; background: #000; z-index: 20;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <div class="right"><span>5G</span><span>100%</span></div>
    </div>

    <!-- Modal header : close X (au lieu de hamburger) -->
    <div class="modal-head">
      <div class="close-btn">
        <svg fill="none" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24" width="20" height="20">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </div>
      <span class="step-pill"><b>1</b> / 3 · Détails course</span>
      <div style="width: 40px;"></div>
    </div>

    <div class="titlewrap">
      <h1>Poster une<br/>annonce</h1>
      <p>Dictez la course ou remplissez les champs manuellement.</p>
    </div>

    <!-- Voice button -->
    <div class="voice-section">
      <div class="voice-btn">
        <svg fill="none" stroke="#0a0a0a" stroke-width="2.4" stroke-linecap="round" viewBox="0 0 24 24">
          <rect x="9" y="3" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0014 0M12 18v3M8 21h8"/>
        </svg>
      </div>
      <div class="voice-hint">Appuyez pour dicter</div>
      <div class="voice-sub">« Mardi 14h, hôpital Nord vers Aubagne, CPAM »</div>
    </div>

    <div class="or-divider">
      <div class="line"></div>
      <span class="or">OU MANUELLEMENT</span>
      <div class="line"></div>
    </div>

    <div class="form">
      <div class="field">
        <div class="field-icon">
          <svg fill="none" stroke="#1e40af" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24">
            <circle cx="12" cy="10" r="3"/>
            <path d="M12 2a8 8 0 00-8 8c0 5 8 12 8 12s8-7 8-12a8 8 0 00-8-8z"/>
          </svg>
        </div>
        <div class="field-body">
          <div class="field-label">DÉPART</div>
          <div class="field-value">Adresse de prise en charge</div>
        </div>
        <div class="field-chev">
          <svg fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" width="18" height="18"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>

      <div class="field">
        <div class="field-icon" style="background:#dcfce7;">
          <svg fill="none" stroke="#14532d" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24">
            <path d="M5 12l5 5L20 7"/>
          </svg>
        </div>
        <div class="field-body">
          <div class="field-label">DESTINATION</div>
          <div class="field-value">Où amener le patient</div>
        </div>
        <div class="field-chev">
          <svg fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" width="18" height="18"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>

      <div class="field">
        <div class="field-icon">
          <svg fill="none" stroke="#0a0a0a" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v4l3 2"/>
          </svg>
        </div>
        <div class="field-body">
          <div class="field-label">DATE & HEURE</div>
          <div class="field-value filled">Aujourd'hui · 14h30</div>
        </div>
        <div class="field-chev">
          <svg fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24" width="18" height="18"><path d="M9 18l6-6-6-6"/></svg>
        </div>
      </div>
    </div>

    <div class="cta-bar">
      <button class="cta">Suivant · Patient & tarif</button>
    </div>

    <div class="home-indicator"></div>
  </div>
</body>
</html>
