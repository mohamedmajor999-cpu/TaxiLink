<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>V6 - Notif nouvelle mission</title>
  <style>
    :root {
      --ink: #0a0a0a; --ink-soft: #6b6b6b; --ink-muted: #9a9a9a;
      --bg: #ffffff; --line: #ececec;
      --brand: #ffd23f; --accent: #1a1a1a;
      --success: #16a34a; --danger: #dc2626;
    }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #1c1c1c; color: var(--ink);
    }
    .phone {
      width: 390px; height: 844px; margin: 40px auto;
      background: var(--bg); border-radius: 44px;
      overflow: hidden; position: relative;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 8px #2a2a2a, 0 0 0 9px #555;
    }
    .statusbar {
      position: absolute; top: 0; left: 0; right: 0; height: 50px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 32px;
      font-size: 14px; font-weight: 700; color: #fff; z-index: 50;
    }
    .statusbar .right { display: flex; gap: 6px; align-items: center; font-size: 13px; }

    /* Fond carte derriere (flou) */
    .map-bg {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #eef3ee 0%, #c8d4dc 100%);
      filter: blur(8px);
    }
    .map-bg::before {
      content: ""; position: absolute; inset: 0;
      background: rgba(0,0,0,0.55);
    }

    /* Modal takeover plein ecran */
    .takeover {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--accent);
      color: #fff;
      display: flex; flex-direction: column;
      z-index: 20;
    }

    /* Top bar avec countdown */
    .top-section {
      padding: 60px 24px 0;
    }
    .new-mission-label {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,210,63,0.18);
      color: var(--brand);
      font-size: 11.5px; font-weight: 800;
      letter-spacing: 0.8px;
      padding: 6px 12px; border-radius: 999px;
      margin-bottom: 14px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    .new-mission-label .ring {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 0 3px rgba(255,210,63,0.3);
    }
    .countdown-bar {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.12);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .countdown-bar .fill {
      height: 100%; width: 65%;
      background: var(--brand);
      border-radius: 2px;
    }

    /* Prix XL central */
    .price-block {
      text-align: center;
      padding: 0 24px 18px;
    }
    .price-block .from {
      font-size: 12.5px; font-weight: 700;
      color: rgba(255,255,255,0.55); letter-spacing: 0.3px;
      margin-bottom: 8px;
    }
    .price-block .price {
      font-size: 80px; font-weight: 900;
      letter-spacing: -4px;
      line-height: 1;
    }
    .price-block .price .euro {
      font-size: 36px; vertical-align: top; margin-top: 12px;
      display: inline-block; color: rgba(255,255,255,0.7);
    }
    .tags-row {
      display: flex; justify-content: center; gap: 8px;
      margin-top: 14px;
    }
    .tag {
      font-size: 11px; font-weight: 800;
      padding: 5px 10px; border-radius: 6px;
      letter-spacing: 0.5px;
    }
    .tag.cpam { background: #dbeafe; color: #1e40af; }
    .tag.urgent { background: rgba(220,38,38,0.18); color: #f87171; }

    /* Mini map preview + trip */
    .trip-card {
      margin: 14px 24px 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 16px;
    }
    .mini-map {
      height: 90px;
      background: linear-gradient(135deg, #2c3e2a 0%, #4a5a48 100%);
      border-radius: 12px;
      position: relative; overflow: hidden;
      margin-bottom: 14px;
    }
    .mini-map .pin-a, .mini-map .pin-b {
      position: absolute;
      background: var(--brand); color: var(--accent);
      font-size: 10px; font-weight: 900;
      padding: 4px 8px; border-radius: 5px;
      letter-spacing: -0.2px;
    }
    .mini-map .pin-a { top: 18px; left: 18px; }
    .mini-map .pin-b { bottom: 18px; right: 18px; background: #fff; color: #0a0a0a; }
    .mini-map .route-line {
      position: absolute; top: 28px; left: 70px;
      width: 220px; height: 2px;
      background: var(--brand);
      transform: rotate(13deg);
      transform-origin: left center;
    }

    .trip-info {
      display: flex; gap: 12px;
    }
    .trip-info .dots {
      display: flex; flex-direction: column; align-items: center; padding-top: 6px;
    }
    .trip-info .dots .a, .trip-info .dots .b {
      width: 9px; height: 9px; border-radius: 50%; background: var(--brand);
    }
    .trip-info .dots .b { background: var(--accent); border: 2px solid var(--brand); }
    .trip-info .dots .line { width: 2px; flex: 1; min-height: 20px; background: rgba(255,210,63,0.35); margin: 3px 0; }
    .trip-info .text { flex: 1; }
    .trip-info .l1 { font-size: 15px; font-weight: 800; letter-spacing: -0.2px; }
    .trip-info .l2 { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 2px; }
    .trip-info .row1 { margin-bottom: 14px; }

    .meta-row {
      display: flex; gap: 18px; margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .meta-row .v { font-size: 14.5px; font-weight: 800; }
    .meta-row .k { font-size: 10.5px; color: rgba(255,255,255,0.5); font-weight: 700; letter-spacing: 0.3px; margin-top: 2px; }

    /* Actions */
    .actions {
      margin-top: auto;
      padding: 16px 24px 36px;
      display: flex; gap: 12px;
    }
    .btn-refuse {
      flex: 0 0 90px;
      height: 60px;
      background: rgba(255,255,255,0.08);
      border: 0; color: #fff;
      border-radius: 18px;
      font-size: 14px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-accept {
      flex: 1;
      height: 60px;
      background: var(--brand); color: var(--ink);
      border: 0; border-radius: 18px;
      font-size: 17px; font-weight: 900;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      letter-spacing: -0.3px;
    }
    .btn-accept .countdown {
      background: rgba(0,0,0,0.18);
      padding: 4px 10px; border-radius: 999px;
      font-size: 13px; font-weight: 800;
    }

    .home-indicator {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 134px; height: 5px; border-radius: 3px; background: #fff; z-index: 30;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="map-bg"></div>

    <div class="statusbar">
      <span>9:41</span>
      <div class="right"><span>5G</span><span>100%</span></div>
    </div>

    <div class="takeover">
      <div class="top-section">
        <span class="new-mission-label">
          <span class="ring"></span>
          NOUVELLE MISSION
        </span>
        <div class="countdown-bar">
          <div class="fill"></div>
        </div>
      </div>

      <div class="price-block">
        <div class="from">DANS TA ZONE &middot; &agrave; 3,2 KM</div>
        <div class="price"><span class="euro">&euro;</span>61</div>
        <div class="tags-row">
          <span class="tag cpam">CPAM</span>
          <span class="tag urgent">URGENT &middot; 8 MIN</span>
        </div>
      </div>

      <div class="trip-card">
        <div class="mini-map">
          <span class="pin-a">D&Eacute;PART</span>
          <span class="pin-b">ARRIV&Eacute;E</span>
        </div>
        <div class="trip-info">
          <div class="dots">
            <div class="a"></div>
            <div class="line"></div>
            <div class="b"></div>
          </div>
          <div class="text">
            <div class="row1">
              <div class="l1">H&ocirc;pital Nord</div>
              <div class="l2">Chemin des Bourrely</div>
            </div>
            <div>
              <div class="l1">Aubagne centre</div>
              <div class="l2">14 km &middot; 22 min de trajet</div>
            </div>
          </div>
        </div>
        <div class="meta-row">
          <div>
            <div class="v">14h30</div>
            <div class="k">D&Eacute;PART</div>
          </div>
          <div>
            <div class="v">Mme M.</div>
            <div class="k">PATIENT</div>
          </div>
          <div>
            <div class="v">★ 4.8</div>
            <div class="k">NOTE PATIENT</div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn-refuse">Refuser</button>
        <button class="btn-accept">
          Accepter
          <span class="countdown">12s</span>
        </button>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</body>
</html>
