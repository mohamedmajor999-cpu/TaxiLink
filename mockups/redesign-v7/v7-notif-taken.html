<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>V7 - Ton annonce est prise</title>
  <style>
    :root {
      --ink: #0a0a0a; --ink-soft: #6b6b6b; --ink-muted: #9a9a9a;
      --bg: #ffffff; --line: #ececec;
      --brand: #ffd23f; --accent: #1a1a1a; --success: #16a34a;
    }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: #1c1c1c; color: var(--ink);
    }
    .phone {
      width: 390px; height: 844px; margin: 40px auto;
      background: var(--bg); border-radius: 44px;
      overflow: hidden; position: relative;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 8px #2a2a2a, 0 0 0 9px #555;
    }
    .statusbar {
      position: absolute; top: 0; left: 0; right: 0; height: 50px;
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 32px;
      font-size: 14px; font-weight: 700; color: var(--ink); z-index: 30;
    }
    .statusbar .right { display: flex; gap: 6px; align-items: center; font-size: 13px; }

    /* Fond carte */
    .map-bg {
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 30%, #eef3ee 0%, #d8e4d6 100%);
    }
    .map-bg::before {
      content: ""; position: absolute; inset: 0;
      background-image:
        linear-gradient(0deg, rgba(120,150,120,0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(120,150,120,0.18) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    .road { position: absolute; background: #fff; box-shadow: 0 0 0 1px #c5d5c3; }
    .road.h1 { top: 220px; left: -20px; right: -20px; height: 14px; transform: rotate(-2deg); }
    .road.v1 { left: 140px; top: -20px; bottom: -20px; width: 12px; }
    .pin-bg {
      position: absolute; transform: translate(-50%, -100%);
      font-weight: 800; font-size: 12px;
      padding: 5px 9px; border-radius: 999px;
      background: #0a0a0a; color: #fff;
    }
    .me-bg {
      position: absolute;
      width: 20px; height: 20px; border-radius: 50%;
      background: #2563eb; border: 4px solid #fff;
      transform: translate(-50%, -50%);
    }

    /* Top bar de la carte attenuee */
    .topbar-bg {
      position: absolute; top: 56px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      opacity: 0.5; z-index: 5;
    }
    .online-pill-bg {
      background: #fff;
      padding: 10px 16px 10px 12px;
      border-radius: 999px;
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13.5px; font-weight: 800;
    }
    .online-pill-bg .dot {
      width: 9px; height: 9px; border-radius: 50%; background: var(--success);
    }

    /* TOAST BANNER : sobre, fond blanc */
    .toast {
      position: absolute;
      top: 56px; left: 14px; right: 14px;
      background: #fff;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.04);
      z-index: 25;
      animation: slideDown 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes slideDown {
      from { transform: translateY(-100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast::before {
      content: "";
      position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      width: 32px; height: 4px; border-radius: 2px;
      background: rgba(0,0,0,0.12);
    }

    .toast-top {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 14px;
      padding-top: 6px;
    }
    .toast-icon-wrap {
      position: relative;
      width: 48px; height: 48px;
      border-radius: 50%;
      background: #ecfdf5;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .toast-icon-wrap svg { width: 24px; height: 24px; }
    .toast-title-row { flex: 1; min-width: 0; }
    .toast-title {
      font-size: 15px; font-weight: 800; letter-spacing: -0.2px;
      display: flex; align-items: center; gap: 6px;
    }
    .toast-time { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }

    /* Driver qui a pris (info, pas une action) */
    .taker {
      display: flex; align-items: center; gap: 12px;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 12px;
      margin-bottom: 12px;
    }
    .taker-avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--brand); color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 900;
      flex-shrink: 0;
    }
    .taker-info { flex: 1; min-width: 0; }
    .taker-name { font-size: 13.5px; font-weight: 800; }
    .taker-sub {
      font-size: 11.5px; color: var(--ink-soft); margin-top: 2px;
      display: flex; align-items: center; gap: 5px;
    }
    .taker-sub .star { color: #f59e0b; font-weight: 800; }
    .taker-sub .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--ink-muted); }
    .taker-call {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--success);
      display: flex; align-items: center; justify-content: center;
    }
    .taker-call svg { width: 16px; height: 16px; stroke: #fff; }

    /* Trip ref */
    .trip-ref {
      padding: 10px 12px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px;
    }
    .trip-ref .arr { color: var(--ink-muted); font-weight: 700; }
    .trip-ref .text { font-size: 12.5px; font-weight: 700; flex: 1; min-width: 0; }
    .trip-ref .price { font-size: 14px; font-weight: 900; }

    /* Actions */
    .toast-actions { display: flex; gap: 8px; }
    .btn-secondary {
      flex: 1; height: 42px;
      background: #f3f3f3; color: var(--ink);
      border: 0; border-radius: 12px;
      font-size: 13px; font-weight: 800;
    }
    .btn-primary {
      flex: 1; height: 42px;
      background: var(--accent); color: #fff;
      border: 0; border-radius: 12px;
      font-size: 13px; font-weight: 800;
    }

    /* Note swipe */
    .swipe-hint {
      position: absolute;
      top: 360px; left: 20px; right: 20px;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.85);
      background: rgba(0,0,0,0.6);
      padding: 6px 12px; border-radius: 10px;
      font-weight: 600;
      z-index: 20;
    }
    .swipe-hint b { color: var(--brand); }

    /* Bottom nav */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 90px; background: #fff;
      border-top: 1px solid var(--line);
      display: flex; justify-content: space-around; align-items: center;
      padding-bottom: 22px; z-index: 10;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 10.5px; font-weight: 700; color: var(--ink-muted); flex: 1;
    }
    .nav-item.active { color: var(--ink); }
    .nav-item.active svg { stroke: var(--ink); }
    .nav-item svg { width: 22px; height: 22px; stroke: var(--ink-muted); }
    .nav-fab-slot { width: 64px; }
    .fab-poster {
      position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
      width: 60px; height: 60px; border-radius: 20px;
      background: var(--brand);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 24px rgba(255,210,63,0.5), 0 0 0 4px #fff;
      z-index: 12;
    }
    .fab-poster svg { width: 28px; height: 28px; }

    .home-indicator {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 134px; height: 5px; border-radius: 3px; background: #000; z-index: 20;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="map-bg">
      <div class="road h1"></div>
      <div class="road v1"></div>
      <span class="pin-bg" style="left: 35%; top: 380px;">42 &euro;</span>
      <span class="pin-bg" style="left: 70%; top: 420px;">28 &euro;</span>
      <div class="me-bg" style="left: 50%; top: 500px;"></div>
    </div>

    <div class="statusbar">
      <span>9:41</span>
      <div class="right"><span>5G</span><span>100%</span></div>
    </div>

    <div class="topbar-bg">
      <div class="online-pill-bg">
        <span class="dot"></span>
        En ligne
      </div>
    </div>

    <!-- Toast info "ton annonce a ete prise" -->
    <div class="toast">
      <div class="toast-top">
        <div class="toast-icon-wrap">
          <svg fill="none" stroke="#16a34a" stroke-width="2.3" stroke-linecap="round" viewBox="0 0 24 24">
            <path d="M5 12l5 5L20 7"/>
          </svg>
        </div>
        <div class="toast-title-row">
          <div class="toast-title">Ton annonce a &eacute;t&eacute; prise</div>
          <div class="toast-time">il y a 8 secondes</div>
        </div>
      </div>

      <div class="taker">
        <div class="taker-avatar">KL</div>
        <div class="taker-info">
          <div class="taker-name">Karim Lavezzi</div>
          <div class="taker-sub">
            <span class="star">&starf; 4,9</span>
            <span class="dot"></span>
            <span>CPAM 13</span>
            <span class="dot"></span>
            <span>3 courses ensemble</span>
          </div>
        </div>
        <div class="taker-call">
          <svg fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" viewBox="0 0 24 24">
            <path d="M21 15v4a2 2 0 01-2 2 18 18 0 01-16-16 2 2 0 012-2h4a2 2 0 012 1.7c.1.9.3 1.8.6 2.6a2 2 0 01-.5 2.1l-1.7 1.7a16 16 0 006.6 6.6l1.7-1.7a2 2 0 012.1-.5c.8.3 1.7.5 2.6.6a2 2 0 011.7 2z"/>
          </svg>
        </div>
      </div>

      <div class="trip-ref">
        <span class="text">
          H&ocirc;pital Nord <span class="arr">&rarr;</span> Aubagne
        </span>
        <span class="price">61 &euro;</span>
      </div>

      <div class="toast-actions">
        <button class="btn-secondary">Plus tard</button>
        <button class="btn-primary">Voir l'annonce</button>
      </div>
    </div>

    <div class="swipe-hint">
      <b>Glisser vers le haut</b> pour ignorer
    </div>

    <div class="bottom-nav">
      <div class="nav-item active">
        <svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M3 12l9-9 9 9M5 10v11h14V10"/></svg>
        Carte
      </div>
      <div class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
        Courses
      </div>
      <div class="nav-fab-slot"></div>
      <div class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><circle cx="17" cy="9" r="3"/><path d="M2 21c0-3.5 3-6 7-6s7 2.5 7 6M14 21c0-2.5 2-4.5 5-4.5s5 2 5 4.5"/></svg>
        Groupes
      </div>
      <div class="nav-item">
        <svg fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
        Profil
      </div>
    </div>

    <div class="fab-poster">
      <svg fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" viewBox="0 0 24 24">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </div>

    <div class="home-indicator"></div>
  </div>
</body>
</html>
