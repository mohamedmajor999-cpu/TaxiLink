<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Maquette 1 — Modern Pro · TaxiLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --yellow:#FFD500; --yellow-dark:#F2BC00;
      --ink:#0A0A0B; --ink-2:#1C1C1F;
      --t-1:#0A0A0B; --t-2:#6B6B70; --t-3:#98989D;
      --bg:#FAFAFA; --surface:#FFFFFF;
      --line:#EEEEF0; --line-strong:#E1E1E4;
      --green:#22C55E; --green-soft:rgba(34,197,94,.12);
      --red:#EF4444;
    }
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:radial-gradient(ellipse at top,#1a1a1d 0%,#0a0a0b 100%);
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      padding:32px;color:#fff;font-feature-settings:'ss01','cv11';
    }
    .phone{
      width:390px;height:844px;background:#000;border-radius:55px;
      border:11px solid #0b0b0b;position:relative;overflow:hidden;
      box-shadow:
        0 0 0 1.5px rgba(255,255,255,.08),
        0 30px 80px rgba(0,0,0,.6),
        0 70px 140px rgba(0,0,0,.4);
    }
    /* Dynamic Island */
    .island{
      position:absolute;top:12px;left:50%;transform:translateX(-50%);
      width:124px;height:36px;border-radius:20px;background:#000;z-index:30;
    }
    /* Status bar */
    .status{
      position:absolute;top:0;left:0;right:0;height:54px;z-index:25;
      display:flex;justify-content:space-between;align-items:center;
      padding:18px 32px 0;font-family:'Inter';font-weight:600;font-size:15px;color:#0A0A0B;
      letter-spacing:-.2px;
    }
    .status .ind{display:flex;align-items:center;gap:6px;color:#0A0A0B}
    .status .ind svg{display:block}

    /* MAP */
    .map{position:absolute;inset:0;z-index:1}
    .map svg{width:100%;height:100%;display:block}

    /* Top floating controls */
    .floating{position:absolute;top:62px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;z-index:6}
    .pill{
      background:#fff;color:#0A0A0B;padding:11px 16px;border-radius:999px;
      font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px;
      box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.10);
      letter-spacing:-.2px;
    }
    .pill .live{width:8px;height:8px;border-radius:50%;background:var(--green);position:relative}
    .pill .live::after{content:'';position:absolute;inset:-3px;border-radius:50%;background:var(--green);opacity:.25;animation:pulse 2s ease-out infinite}
    @keyframes pulse{0%{transform:scale(.8);opacity:.6}100%{transform:scale(2);opacity:0}}
    .pill .count{background:#0A0A0B;color:#fff;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:2px}

    .icon-btn{
      width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;
      box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.10);
    }

    /* NOTIFICATION CARD */
    .sheet{
      position:absolute;left:8px;right:8px;bottom:92px;
      background:var(--surface);border-radius:32px;z-index:10;
      box-shadow:
        0 1px 2px rgba(0,0,0,.04),
        0 12px 32px rgba(0,0,0,.10),
        0 40px 80px -16px rgba(0,0,0,.25);
      overflow:hidden;
      animation:slide 700ms cubic-bezier(.16,1,.3,1);
    }
    @keyframes slide{from{transform:translateY(50px);opacity:0}to{transform:translateY(0);opacity:1}}

    /* timer linear */
    .timer{height:3px;background:#F0F0F2;position:relative}
    .timer-fill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,var(--yellow),var(--yellow-dark));animation:tick 15s linear forwards;border-radius:0 2px 2px 0}
    @keyframes tick{from{width:100%}to{width:0%}}

    .body{padding:22px 22px 20px}

    /* hero row */
    .hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:6px}
    .hero .left .eyebrow{font-size:11px;font-weight:700;color:var(--t-3);letter-spacing:1.4px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
    .hero .left .eyebrow::before{content:'';display:block;width:5px;height:5px;border-radius:50%;background:var(--yellow)}
    .hero .left h1{font-size:23px;font-weight:800;color:var(--t-1);margin:5px 0 0;letter-spacing:-.5px;line-height:1.1}
    .hero .right{text-align:right}
    .price{font-size:34px;font-weight:800;color:var(--t-1);letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums}
    .price .cur{font-size:18px;font-weight:600;color:var(--t-2);margin-left:1px;letter-spacing:-.5px}
    .bonus{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(180deg,#FFF6CC,#FFEC9E);color:#5C4500;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;margin-top:7px;letter-spacing:.2px;border:1px solid #F4D24A}
    .bonus svg{display:block}

    /* metrics row */
    .metrics{display:flex;align-items:center;gap:6px;margin:16px 0 18px;color:var(--t-2);font-size:13.5px;font-weight:500}
    .metrics .m{display:inline-flex;align-items:center;gap:6px;background:#F6F6F7;border:1px solid var(--line);padding:8px 12px;border-radius:12px;letter-spacing:-.1px}
    .metrics .m strong{color:var(--t-1);font-weight:700}
    .metrics .m svg{color:var(--t-2)}

    /* ROUTE with mini-map snippet */
    .route-block{
      display:grid;grid-template-columns:1fr 86px;gap:14px;margin-bottom:18px;
      background:#FAFAFB;border:1px solid var(--line);border-radius:18px;padding:14px;
    }
    .route{position:relative;padding-left:24px}
    .route::before{content:'';position:absolute;left:7px;top:18px;bottom:22px;width:2px;background:repeating-linear-gradient(180deg,var(--t-3) 0 4px,transparent 4px 8px);border-radius:2px}
    .stop{margin-bottom:14px;position:relative}
    .stop:last-child{margin-bottom:0}
    .stop::before{content:'';position:absolute;left:-24px;width:14px;height:14px;border-radius:50%}
    .stop.from::before{top:4px;background:var(--surface);border:4px solid var(--green);box-shadow:0 0 0 3px var(--green-soft)}
    .stop.to::before{top:4px;background:var(--t-1);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--t-1)}
    .stop .lbl{font-size:10.5px;font-weight:700;color:var(--t-3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:2px}
    .stop .name{font-size:14.5px;font-weight:700;color:var(--t-1);letter-spacing:-.2px;line-height:1.25}
    .stop .sub{font-size:12.5px;color:var(--t-2);margin-top:1px;line-height:1.3}

    .mini-map{
      width:86px;height:100%;min-height:120px;border-radius:12px;overflow:hidden;
      background:#EEE6D9;position:relative;border:1px solid var(--line);
    }
    .mini-map svg{width:100%;height:100%;display:block}

    /* swipe button */
    .swipe{
      position:relative;height:64px;border-radius:20px;
      background:linear-gradient(180deg,#FFE145,var(--yellow) 50%,var(--yellow-dark));
      box-shadow:
        0 1px 0 rgba(255,255,255,.5) inset,
        0 -2px 0 rgba(0,0,0,.06) inset,
        0 1px 2px rgba(0,0,0,.06),
        0 12px 24px -4px rgba(242,188,0,.55);
      overflow:hidden;cursor:pointer;
    }
    .swipe-text{
      position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;
      font-weight:800;font-size:14.5px;color:var(--t-1);letter-spacing:2.2px;text-transform:uppercase;
    }
    .swipe-thumb{
      position:absolute;top:5px;left:5px;width:54px;height:54px;border-radius:15px;background:var(--t-1);
      display:flex;align-items:center;justify-content:center;color:var(--yellow);
      box-shadow:0 4px 12px rgba(0,0,0,.25);animation:nudge 1.8s ease-in-out infinite;
    }
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}

    .footer-link{
      text-align:center;margin-top:14px;color:var(--t-3);font-size:13.5px;font-weight:600;
      cursor:pointer;letter-spacing:-.1px;
    }
    .footer-link:hover{color:var(--t-1)}

    /* bottom nav */
    .nav{
      position:absolute;left:0;right:0;bottom:0;height:84px;
      background:rgba(255,255,255,.96);backdrop-filter:blur(20px);
      border-top:1px solid var(--line);
      display:flex;justify-content:space-around;align-items:flex-start;padding:14px 16px 0;
      z-index:8;
    }
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--t-3);letter-spacing:-.1px}
    .nav-item.active{color:var(--t-1)}
    .nav-item svg{display:block}
    .nav-fab{
      width:54px;height:54px;border-radius:18px;background:linear-gradient(180deg,#FFE145,var(--yellow-dark));
      display:flex;align-items:center;justify-content:center;color:var(--t-1);
      box-shadow:0 10px 24px rgba(242,188,0,.45);margin-top:-12px;
    }

    .legend{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:#fff;font-size:12px;opacity:.4;letter-spacing:.4px}
  </style>
</head>
<body>
  <div class="phone">

    <!-- MAP -->
    <div class="map">
      <svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="terrain1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F2EBDB"/>
            <stop offset="1" stop-color="#E5DCC4"/>
          </linearGradient>
          <pattern id="hatch1" patternUnits="userSpaceOnUse" width="8" height="8">
            <path d="M0,4 L8,4" stroke="rgba(0,0,0,.018)" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="390" height="844" fill="url(#terrain1)"/>
        <rect width="390" height="844" fill="url(#hatch1)"/>

        <!-- Water (Méditerranée) -->
        <path d="M-20,600 Q 100,580 200,620 Q 290,650 410,625 L 410,884 L -20,884 Z" fill="#B6D7EB"/>
        <path d="M-20,600 Q 100,580 200,620 Q 290,650 410,625" stroke="#88BCD8" stroke-width="1" fill="none" opacity=".5"/>

        <!-- Parks -->
        <ellipse cx="65" cy="180" rx="60" ry="38" fill="#C9DBBB" opacity=".9"/>
        <path d="M260,80 Q 330,75 355,135 Q 345,210 280,210 Q 225,165 260,80Z" fill="#C9DBBB" opacity=".9"/>

        <!-- Highways (A7/A55 stylisé) -->
        <path d="M-30,320 Q 80,275 175,330 Q 250,375 410,355" stroke="#F4D796" stroke-width="14" fill="none" stroke-linecap="round"/>
        <path d="M-30,320 Q 80,275 175,330 Q 250,375 410,355" stroke="#EDB85D" stroke-width="1.5" fill="none" stroke-dasharray="3 5"/>

        <!-- Major streets -->
        <g stroke="#FEFCF8" stroke-linecap="round" fill="none">
          <path d="M-10,440 Q 120,410 250,450 Q 320,485 410,470" stroke-width="7"/>
          <path d="M125,-10 Q 135,180 115,360 Q 105,500 135,720" stroke-width="6"/>
          <path d="M315,-10 Q 295,200 325,420 Q 345,580 310,720" stroke-width="6"/>
          <path d="M-10,200 Q 80,190 180,215 Q 280,240 410,210" stroke-width="5"/>
        </g>

        <!-- Minor streets -->
        <g stroke="#FEFCF8" stroke-linecap="round" fill="none" stroke-width="2.5" opacity=".95">
          <path d="M0,100 L 390,108"/>
          <path d="M0,260 L 390,272"/>
          <path d="M0,520 L 390,510"/>
          <path d="M55,-10 L 65,560"/>
          <path d="M195,-10 L 205,500"/>
          <path d="M255,-10 L 245,440"/>
          <path d="M365,-10 L 375,560"/>
        </g>

        <!-- Building footprints -->
        <g fill="#D9CFB6" opacity=".7">
          <rect x="20" y="118" width="28" height="22" rx="1"/>
          <rect x="60" y="118" width="34" height="22" rx="1"/>
          <rect x="100" y="118" width="20" height="22" rx="1"/>
          <rect x="140" y="118" width="46" height="22" rx="1"/>
          <rect x="200" y="118" width="30" height="22" rx="1"/>
          <rect x="20" y="280" width="42" height="28" rx="1"/>
          <rect x="70" y="280" width="38" height="28" rx="1"/>
          <rect x="115" y="280" width="60" height="28" rx="1"/>
          <rect x="180" y="280" width="36" height="28" rx="1"/>
          <rect x="220" y="280" width="22" height="28" rx="1"/>
          <rect x="20" y="380" width="32" height="38" rx="1"/>
          <rect x="60" y="380" width="55" height="38" rx="1"/>
          <rect x="125" y="380" width="22" height="38" rx="1"/>
          <rect x="160" y="385" width="40" height="33" rx="1"/>
          <rect x="270" y="290" width="42" height="24" rx="1"/>
          <rect x="320" y="290" width="38" height="24" rx="1"/>
          <rect x="270" y="335" width="60" height="22" rx="1"/>
          <rect x="335" y="335" width="25" height="22" rx="1"/>
        </g>

        <!-- Labels -->
        <text x="40" y="160" font-family="Inter" font-size="9" fill="#7E8770" font-weight="700" opacity=".7" letter-spacing="1">PARC LONGCHAMP</text>
        <text x="260" y="500" font-family="Inter" font-size="10" fill="#8B8270" font-weight="600" opacity=".6">Bd de la Libération</text>
        <text x="35" y="640" font-family="Inter" font-size="11" fill="#5BA1C7" font-weight="800" opacity=".85" letter-spacing="2.5">MARSEILLE</text>

        <!-- Route shadow -->
        <path d="M70,260 Q 130,310 200,355 Q 260,395 305,440" stroke="rgba(0,0,0,.18)" stroke-width="9" fill="none" stroke-linecap="round" transform="translate(0,2)"/>
        <!-- Route base -->
        <path d="M70,260 Q 130,310 200,355 Q 260,395 305,440" stroke="#0A0A0B" stroke-width="6" fill="none" stroke-linecap="round"/>
        <!-- Route fill -->
        <path d="M70,260 Q 130,310 200,355 Q 260,395 305,440" stroke="#FFD500" stroke-width="3.5" fill="none" stroke-linecap="round"/>

        <!-- Pickup pin -->
        <g transform="translate(70, 260)">
          <ellipse cy="14" rx="10" ry="2.5" fill="rgba(0,0,0,.18)"/>
          <circle r="14" fill="white" opacity=".7"/>
          <circle r="9" fill="white" stroke="#22C55E" stroke-width="4"/>
        </g>
        <!-- Dropoff pin -->
        <g transform="translate(305, 440)">
          <ellipse cy="22" rx="9" ry="3" fill="rgba(0,0,0,.25)"/>
          <path d="M0,-18 C -11,-18 -18,-10 -18,-1 C -18,10 0,24 0,24 C 0,24 18,10 18,-1 C 18,-10 11,-18 0,-18Z" fill="#0A0A0B"/>
          <circle cx="0" cy="-1" r="5.5" fill="white"/>
        </g>
      </svg>
    </div>

    <!-- iOS Frame -->
    <div class="island"></div>
    <div class="status">
      <span class="time">9:41</span>
      <div class="ind">
        <svg width="18" height="11" viewBox="0 0 18 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx=".5"/><rect x="5" y="5" width="3" height="6" rx=".5"/><rect x="10" y="3" width="3" height="8" rx=".5"/><rect x="15" y="0" width="3" height="11" rx=".5"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 11a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM3 6.5a7 7 0 0110 0l-1.4 1.4a5 5 0 00-7.2 0L3 6.5zM0 3.5a11 11 0 0116 0L14.6 4.9a9 9 0 00-13.2 0L0 3.5z"/></svg>
        <svg width="27" height="11" viewBox="0 0 27 11" fill="none"><rect x=".5" y=".5" width="22" height="10" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="7" rx="1.5" fill="currentColor"/><rect x="24" y="3.5" width="2" height="4" rx=".7" fill="currentColor" opacity=".4"/></svg>
      </div>
    </div>

    <!-- Top floating -->
    <div class="floating">
      <div class="pill"><span class="live"></span> En ligne <span class="count">2</span></div>
      <div class="icon-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A0A0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6M12 17v6M4.22 4.22l4.24 4.24M15.54 15.54l4.24 4.24M1 12h6M17 12h6M4.22 19.78l4.24-4.24M15.54 8.46l4.24-4.24"/></svg>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="nav">
      <div class="nav-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 01-1 1h-5v-7h-6v7H4a1 1 0 01-1-1V9.5z"/></svg>
        Carte
      </div>
      <div class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        Courses
      </div>
      <div class="nav-fab">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H7a4 4 0 00-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Groupes
      </div>
      <div class="nav-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Profil
      </div>
    </div>

    <!-- NOTIFICATION SHEET -->
    <section class="sheet">
      <div class="timer"><div class="timer-fill"></div></div>
      <div class="body">
        <div class="hero">
          <div class="left">
            <div class="eyebrow">Nouvelle course</div>
            <h1>Course privée</h1>
            <span class="bonus">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
              Bonus heures creuses
            </span>
          </div>
          <div class="right">
            <div class="price">28<span class="cur">€</span></div>
          </div>
        </div>

        <div class="metrics">
          <div class="m">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="9"/></svg>
            <strong>0.4 km</strong>
          </div>
          <div class="m">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            <strong>20 km</strong>
          </div>
          <div class="m">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            dans <strong>33 min</strong>
          </div>
        </div>

        <!-- Route + mini map -->
        <div class="route-block">
          <div class="route">
            <div class="stop from">
              <div class="lbl">Départ</div>
              <div class="name">Collège Rosa Parks</div>
              <div class="sub">236 Rue de Lyon, 13015</div>
            </div>
            <div class="stop to">
              <div class="lbl">Arrivée</div>
              <div class="name">Vitrolles</div>
              <div class="sub">13127 Vitrolles</div>
            </div>
          </div>
          <div class="mini-map">
            <svg viewBox="0 0 86 120" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
              <rect width="86" height="120" fill="#EEE6D9"/>
              <path d="M-5,75 Q 30,72 50,82 Q 70,90 95,86 L 95,130 L -5,130 Z" fill="#B6D7EB"/>
              <g stroke="#FEFCF8" stroke-linecap="round" fill="none">
                <path d="M0,30 Q 30,28 60,38 Q 80,46 95,42" stroke-width="3"/>
                <path d="M22,-5 L 26,80" stroke-width="2.5"/>
                <path d="M70,-5 L 64,90" stroke-width="2"/>
              </g>
              <path d="M14,28 Q 30,42 48,52 Q 64,60 72,72" stroke="#0A0A0B" stroke-width="4" fill="none" stroke-linecap="round"/>
              <path d="M14,28 Q 30,42 48,52 Q 64,60 72,72" stroke="#FFD500" stroke-width="2" fill="none" stroke-linecap="round"/>
              <circle cx="14" cy="28" r="4" fill="white" stroke="#22C55E" stroke-width="2"/>
              <circle cx="72" cy="72" r="4" fill="#0A0A0B"/>
            </svg>
